name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 清单与数据完整性：BOM、dsh.bundle.patch、files[] 存在性、
      # 生命周期脚本、peerDependencies、cordis.patch.yml、data/*.json
      - name: Check manifest and bundled data
        run: node tests/check-package.mjs

      # 离线自检：数据库、设计系统生成、UX 审查、检索、中文输出
      - name: Offline smoke test
        run: node tests/smoke.mjs

      # 示例页面：脚本可编译、无障碍要点、令牌化、状态完备性
      - name: Check example pages
        run: node tests/check-example.mjs

      # 真实 DOM 执行验证：渲染结果、预算/倒计时计算、模式切换、排序与编辑
      # jsdom 装在独立目录，避免连带解析本插件的 peerDependencies
      - name: DOM smoke test (jsdom, isolated install)
        env:
          DOM_SMOKE_JSDOM: ${{ runner.temp }}/domdeps/node_modules/jsdom/lib/api.js
        run: |
          mkdir -p "$RUNNER_TEMP/domdeps"
          cd "$RUNNER_TEMP/domdeps"
          npm init -y > /dev/null
          npm install --no-audit --no-fund jsdom
          cd "$GITHUB_WORKSPACE"
          node tests/dom-smoke.mjs
