name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 一键全量：清单/数据、离线自检、示例规范、能力数字、契约、
      # 分层守卫、SchemaSpec 方言（dom-smoke 在 jsdom 缺失时自动跳过）
      - name: Run test suite
        run: npm test

      # 真实 DOM 执行验证：渲染结果、预算/倒计时计算、模式切换、排序与编辑
      # jsdom 装在独立目录，避免连带解析本插件的 peerDependencies
      - name: DOM smoke test (jsdom, isolated install)
        env:
          DOM_SMOKE_JSDOM: ${{ runner.temp }}/domdeps/node_modules/jsdom/lib/api.js
        run: |
          mkdir -p "$RUNNER_TEMP/domdeps"
          cd "$RUNNER_TEMP/domdeps"
          npm init -y > /dev/null
          npm install --no-audit --no-fund jsdom
          cd "$GITHUB_WORKSPACE"
          node tests/dom-smoke.mjs
