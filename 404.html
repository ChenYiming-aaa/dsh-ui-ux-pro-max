<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · UI/UX Pro Max</title>
<meta name="robots" content="noindex">
<!--
  404 兜底页：GitHub Pages 对任何找不到的路径都回这个文件（内容在这里，地址栏不变），
  所以链接不能写死相对路径——按当前地址的第一段推出站点根，再拼 gallery/ 与 handbook/。
  图鉴与手册各有一份自己的 404（站内用），这一份只在整站层面兜底。
-->
<style>
  :root { --paper: #f6f5f1; --ink: #14161a; --ink-2: #4a4f57; --ink-3: #6b7176; --accent: #e4501e; --rule: rgba(20, 22, 26, .14); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { min-height: 100vh; display: grid; place-items: center; padding: 32px 20px;
    background-image: linear-gradient(90deg, rgba(20, 22, 26, .07) 0 1px, transparent 1px);
    background-size: 25% 100%;
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  main { max-width: 520px; width: 100%; }
  .code { font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .22em;
    color: var(--accent); text-transform: uppercase; margin: 0 0 18px; }
  h1 { font-size: 30px; line-height: 1.25; letter-spacing: -.01em; margin: 0 0 10px; font-weight: 600; }
  p { color: var(--ink-2); margin: 0 0 26px; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; }
  a { color: var(--ink); text-decoration: none; border: 1px solid var(--rule); border-radius: 2px;
    padding: 9px 16px; font-size: 14px; background: rgba(255, 255, 255, .55); transition: border-color .18s, background .18s; }
  a:hover { border-color: var(--ink); background: #fff; }
  a.primary { border-color: rgba(228, 80, 30, .4); color: var(--accent); font-weight: 600; background: rgba(228, 80, 30, .07); }
  a.primary:hover { border-color: var(--accent); background: rgba(228, 80, 30, .12); }
  .fine { margin: 22px 0 0; font-size: 12.5px; color: var(--ink-3); }
</style>
</head>
<body>
<main>
  <p class="code">404 · Not Found</p>
  <h1>这个地址没有页面</h1>
  <p>可能是旧链接，或者站点刚重建过。回到两个入口之一继续：</p>
  <div class="links">
    <a class="primary" data-to="gallery/" href="../gallery/">风格图鉴</a>
    <a data-to="handbook/" href="../handbook/">设计手册</a>
  </div>
  <p class="fine">两个站同级部署：<code>/gallery/</code> 是 88 种风格，<code>/handbook/</code> 是配色 / 字体 / 图表 / 落地页 / 规范 / 配方。</p>
</main>
<script>
  (function () {
    // 地址栏还停在缺失的路径上，相对路径不可靠：用第一段当站点根
    var seg = location.pathname.split('/')[1] || '';
    var root = seg && seg.indexOf('.') < 0 ? '/' + seg + '/' : '/';
    var links = document.querySelectorAll('a[data-to]');
    for (var i = 0; i < links.length; i += 1) {
      links[i].setAttribute('href', root + links[i].getAttribute('data-to'));
    }
  })();
</script>
</body>
</html>
