# dsh-ui-ux-pro-max bundle: registers the host tools (design_recommend /
# design_review / design_search) and the bundled ui-ux-pro-max skill.
# Applied after @deepseek-ai/dsh-base, which already mounts the tool registry,
# skill registry, and harness seam.
- insert:
    - id: ui-ux-pro-max
      name: dsh-ui-ux-pro-max
      # 默认值即下列三项；省略 config 等价于使用默认值。
      config:
        maxResults: 3
        reviewRules: 8
        skill: true
