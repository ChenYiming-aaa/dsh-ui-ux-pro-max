<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI/UX Pro Max · 风格图鉴与设计手册</title>
<!--
  站点根入口：立刻跳到 gallery/（风格图鉴）。

  这里刻意不放任何文字。原来这页会显示一行「正在进入风格图鉴…」，
  现在改成：本页只画一张与过场首帧完全一致的纸面（同底色 + 同位置的四条发丝竖线），
  跳转后由 gallery/index.html 的开场动画接手（见 tools/intro.mjs）。
  两帧底色与网格对齐，所以跳转本身看不出来——中间那段「过场」就是动画的第一幕。

  两个站是同级目录，手册用 ../gallery/ 指回图鉴，所以本地双击打开与线上
  部署时的相对路径完全一致。GitHub Pages 的产物由 .github/workflows/pages.yml
  拼装：dist/index.html（本文件）+ dist/gallery/ + dist/handbook/。

  线上：
    https://chenyiming-aaa.github.io/dsh-ui-ux-pro-max/gallery/
    https://chenyiming-aaa.github.io/dsh-ui-ux-pro-max/handbook/
-->
<link rel="canonical" href="gallery/index.html">
<meta http-equiv="refresh" content="0; url=gallery/index.html">
<style>
  html { background: #f6f5f1; }
  body { margin: 0; min-height: 100vh; background: #f6f5f1;
    background-image: linear-gradient(90deg, rgba(20, 22, 26, 0.07) 0 1px, transparent 1px);
    background-size: 25% 100%; }
  /* 整页都是可点区域：万一 meta refresh 被拦，随手一点也能进站 */
  .gate { position: fixed; inset: 0; display: block; outline-offset: -4px; }
</style>
</head>
<body>
  <a class="gate" href="gallery/index.html" aria-label="进入风格图鉴"></a>
</body>
</html>
